name: CPL site QA
on:
  push:
    branches: [main, cpl-2-colorful-helpful]
  pull_request:
permissions:
  contents: read
jobs:
  static-and-behavior:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python scripts/check-local-links.py
      - run: python scripts/check-site-scripts.py
      - run: node scripts/check-catalog.cjs
      - run: node scripts/check-school-guide-parity.js
      # The experimental DSM lab moved to its own project; the removed test no longer belongs here.
      - run: node tests/homepage-pathways.cjs
      - run: node tests/library-navigation.cjs
      - run: node tests/navigation-destinations.cjs
      - run: node tests/child-population-filter.cjs
      - run: node tests/online-lgbtq-resources.cjs
      - run: node tests/finder-card-readability.cjs
      - run: node tests/affirming-practice-content.cjs
      - run: node tests/combined-cpl-finder-qa.cjs
      - run: node tests/birth-to-five-resources.cjs
      - run: node tests/finder-lab-ux.cjs
      - run: node tests/finder-release-qa.cjs
      - run: node tests/adult-adhd-collection-qa.cjs
      - run: node tests/diagnosis-practice-labs.cjs
      - run: node tests/diagnosis-resource-hubs.cjs
      - run: node tests/condition-case-management.cjs
      - run: node tests/comprehensive-diagnosis-guides.cjs
      - run: node tests/diagnosis-release-reconciliation.cjs
      - run: node tests/expanded-external-resources.cjs
      - run: node tests/community-guide-individual-index.cjs
      - run: node tests/community-guides-online.cjs
      - run: node tests/clinical-resources-qa.cjs
      - run: node tests/thermometer-levels.cjs
      - run: node tests/state-iep-guides.cjs
      - run: node tests/iep-editorial-qa.cjs
      - run: node tests/repository-language-audit.cjs
