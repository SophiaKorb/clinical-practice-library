name: CPL site QA
on:
  push:
    branches: [main, cpl-2-colorful-helpful]
  pull_request:
permissions:
  contents: read
jobs:
  static-and-behavior:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      # Ensure authored topic pages match their reproducible source generator.
      - run: python -m py_compile scripts/build-topic-expansion.py scripts/expansion-topics.py scripts/create-topic-pdfs.py
      - run: python scripts/build-topic-expansion.py --waves 5
      - run: git diff --exit-code -- resources/clinical-topics data/topic-expansion-ledger.json data/topic-evidence-registry.json
      - run: python scripts/site-navigation.py --check
      - run: node tests/static-navigation.cjs
      - run: python scripts/check-local-links.py
      - run: python scripts/check-site-scripts.py
      - run: node scripts/check-catalog.cjs
      - run: node scripts/check-school-guide-parity.js
      # The experimental DSM lab moved to its own project; the removed test no longer belongs here.
      - run: node tests/homepage-pathways.cjs
      - run: node tests/mobile-homepage.cjs
      - run: node tests/thermometer-levels.cjs
      - run: node tests/communication-print.cjs
      - run: node tests/clinical-expansion.cjs
      - run: node tests/assessment-school.cjs
      - run: node tests/practice-learning.cjs
      - run: node tests/clinical-finder.cjs
      - run: node tests/topic-expansion.cjs
      - run: python scripts/audit-navigation-accessibility.py
