name: Therapy shelf links browser QA
on:
  pull_request:
    paths:
      - 'resources/therapy/start-here-therapy-resource-shelves.html'
      - 'resources/resource.css'
      - 'resources/site-navigation.css'
      - 'tests/nav-shelf-links-rendered.cjs'
      - '.github/workflows/nav-shelf-links-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: python -m http.server 8765 --bind 127.0.0.1 >/tmp/nav-http.log 2>&1 &
      - run: node tests/nav-shelf-links-rendered.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: therapy-shelf-link-evidence
          path: /tmp/nav-shelves-*
          retention-days: 10
