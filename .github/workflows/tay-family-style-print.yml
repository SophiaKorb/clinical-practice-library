name: CPL TAY family-style printable review
on:
  pull_request:
    paths:
      - 'scripts/build-tay-family-style-print.py'
      - 'scripts/qa/extract_tay_original_source.py'
      - '.github/workflows/tay-family-style-print.yml'
      - 'resources/community/original-pdfs/Southern_Arizona_Youth_Transition_Resources_2026.pdf'
permissions:
  contents: read
jobs:
  build-and-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install original-font dependencies and PDF verifier
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-lato fonts-ebgaramond
          python -m pip install --disable-pip-version-check --quiet pymupdf reportlab Pillow
      - name: Extract original directory source (read-only)
        run: python scripts/qa/extract_tay_original_source.py
      - name: Build revised TAY printer from approved original PDF
        run: python scripts/build-tay-family-style-print.py
      - name: Audit page-by-page PDF and save grayscale/screen previews
        run: |
          python - <<'PY'
          import fitz, json, hashlib, re, pathlib
          from PIL import Image, ImageDraw
          out=pathlib.Path('qa-artifacts/community-tay-redesign')
          pdf=fitz.open(out/'CPL_TAY_Community_Guide_Redesigned_2026.pdf')
          qa=json.loads((out/'CPL_TAY_Redesign_QA.json').read_text())
          original=fitz.open('resources/community/original-pdfs/Southern_Arizona_Youth_Transition_Resources_2026.pdf')
          assert len(pdf)==qa['pages']==31, (len(pdf),qa)
          assert qa['redesigned_pages']==15 and qa['preserved_original_pages']==len(original)==13 and qa['printed_url_pages']==3
          # Every source page, original link target, and exact extracted page text is conserved.
          offset=qa['redesigned_pages']
          for j,page in enumerate(original):
              now=pdf[offset+j]
              assert now.get_text()==page.get_text(), f'archival text changed page {j+1}'
              a=[l.get('uri') for l in page.get_links() if l.get('uri','').startswith('http')]
              b=[l.get('uri') for l in now.get_links() if l.get('uri','').startswith('http')]
              assert a==b, f'archival link destinations changed page {j+1}'
          # Each new page contains text and keeps it on physical US Letter.
          report=[]
          for j,page in enumerate(pdf):
              assert int(page.rect.width)==612 and int(page.rect.height)==792
              t=page.get_text()
              assert t.strip(), f'blank page {j+1}'
              blocks=[b for b in page.get_text('blocks') if b[6]==0]
              if not offset<=j<offset+13:
                  assert all(b[0]>=23 and b[1]>=12 and b[2]<=590 and b[3]<=779 for b in blocks), f'clipped page {j+1}'
              urls=[l.get('uri') for l in page.get_links() if l.get('uri','').startswith('http')]
              report.append({'page':j+1,'source_archive':offset<=j<offset+13,'chars':len(t),'external_links':len(urls)})
          assert 31==len(report)
          # Print indexes must contain *every* web URL in the non-index pages.
          urls=set()
          for page in list(pdf)[:offset+13]:
              urls.update(l['uri'] for l in page.get_links() if l.get('uri','').startswith('http'))
          index=''.join(p.get_text() for p in list(pdf)[offset+13:]).replace(' ','').replace(chr(10),'')
          assert len(urls)==48
          assert all(url in index for url in urls), 'A complete source URL is missing from printed index'
          # Prior severe orphan: last directory page should not hold just 1-3 entries.
          assert sum(1 for l in pdf[-1].get_links() if l.get('uri','').startswith('http'))>=8
          # Check footer numbering on directory page equals absolute document page.
          assert 'Page 29' in pdf[28].get_text() and 'Page 31' in pdf[30].get_text()
          # Local, public-source fact guards.
          alltext=' '.join(p.get_text() for p in pdf[:offset])
          assert 'under 26' in alltext
          assert 'azyp.org/azyp-programs/family-parenting-support' in alltext
          assert 'I AM YOU 360' in alltext and 'Teen Lifeline' in alltext
          # Render every page and save all-pages contact sheets for independent visual inspection.
          sheets=[]
          for start in range(0,len(pdf),8):
              thumbs=[]
              for i in range(start,min(start+8,len(pdf))):
                  pg=pdf[i]
                  pix=pg.get_pixmap(matrix=fitz.Matrix(.55,.55),alpha=False)
                  im=Image.frombytes('RGB',(pix.width,pix.height),pix.samples)
                  tile=Image.new('RGB',(im.width+14,im.height+32),'white')
                  tile.paste(im,(7,25))
                  ImageDraw.Draw(tile).text((8,5),f'Page {i+1}',fill='black')
                  thumbs.append(tile)
              w=max(t.width for t in thumbs);h=max(t.height for t in thumbs)
              sheet=Image.new('RGB',(w*4,h*2),'#ddd')
              for k,tile in enumerate(thumbs):sheet.paste(tile,((k%4)*w,(k//4)*h))
              path=out/f'contact-sheet-{start+1:02d}-{min(start+8,len(pdf)):02d}.jpg'
              sheet.save(path,quality=88)
              sheets.append(str(path))
          (out/'complete-page-audit.json').write_text(json.dumps({'pages':report,'printed_urls':len(urls),'all_pages_rendered':True,'source_sha256':hashlib.sha256(pathlib.Path('resources/community/original-pdfs/Southern_Arizona_Youth_Transition_Resources_2026.pdf').read_bytes()).hexdigest(),'sha256':hashlib.sha256((out/'CPL_TAY_Community_Guide_Redesigned_2026.pdf').read_bytes()).hexdigest(),'contact_sheets':sheets},indent=2))
          print('TAY_31_PAGE_PRINT_QA_PASS; all source pages and printed URLs verified')
          PY
      - name: Retain private review PDFs, source parity checks and page images
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cpl-tay-family-style-print-review
          path: |
            qa-artifacts/community-tay-redesign/*.pdf
            qa-artifacts/community-tay-redesign/*.json
            qa-artifacts/community-tay-redesign/*.jpg
          retention-days: 14
          if-no-files-found: error
