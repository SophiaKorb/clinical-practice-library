name: CPL rendered keyboard and print QA
on:
  pull_request:
    paths:
      - 'scripts/qa/**'
      - '.github/workflows/pr19-rendered-smoke.yml'
      - 'index.html'
      - 'resources/**'
      - 'legacy/**'
      - 'tests/state-iep-guides.cjs'
jobs:
  browser-keyboard-print:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated test browser
        run: |
          npm install --no-save --no-audit --no-fund playwright axe-core@4.10.3
          npx playwright install --with-deps chromium
      - name: Serve local candidate and run rendered checks
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/cpl-pr19-http.log 2>&1 &
          for i in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:8765/ > /dev/null; then break; fi
            sleep 1
          done
          node scripts/qa/pr19-rendered-smoke.cjs
          node scripts/qa/cpl-pr40-pr41-rendered.cjs
          node scripts/qa/finder-lab-rendered.cjs
          node scripts/qa/finder-release-rendered.cjs
          node scripts/qa/diagnosis-hubs-rendered.cjs
          node scripts/qa/diagnosis-all14-rendered.cjs
          node scripts/qa/diagnosis-practice-labs-rendered.cjs
          node scripts/qa/diagnosis-wave2-rendered.cjs
      - name: Retain CPL review screenshots and printable samples
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cpl-pr43-human-review-artifacts
          path: |
            qa-artifacts/pr43/
            qa-artifacts/diagnosis-hubs/
            qa-artifacts/practice-labs/
            qa-artifacts/diagnosis-wave2/
          if-no-files-found: warn
          retention-days: 14
