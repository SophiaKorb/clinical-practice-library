name: DSM Foundations — complete review-book build
on:
  push:
    branches: [cpl-2-colorful-helpful]
    paths:
      - 'scripts/build-dsm-foundations-book.py'
      - 'scripts/prepare-dsm-print-fonts.py'
      - 'scripts/build-dsm-comparison-appendix.py'
      - 'scripts/data/dsm-comparison-atlas-pairs.json'
      - 'tests/dsm-print-book-parity.py'
      - 'resources/training/dsm-from-zero.html'
      - 'docs/qa/dsm-foundations-all-questions.md'
      - '.github/workflows/dsm-foundations-book.yml'
  workflow_dispatch:
jobs:
  book-and-preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install print-typography font families
        run: sudo apt-get update -qq && sudo apt-get install -y fonts-noto-core fonts-lato fonts-dejavu-core
      - name: Install PDF-generation and preflight dependencies
        run: python -m pip install --disable-pip-version-check reportlab beautifulsoup4 pymupdf fonttools
      - name: Prepare open-license editorial fonts for PDF embedding
        run: python scripts/prepare-dsm-print-fonts.py
      - name: Generate intentional book from canonical course (not website printing)
        run: python scripts/build-dsm-foundations-book.py
      - name: Preflight complete book and check all page geometry
        run: |
          python - <<'PY'
          import fitz,json,re
          from pathlib import Path
          pdf=Path('build/dsm-foundations-complete-review-book.pdf')
          d=fitz.open(pdf)
          manifest=json.loads(Path('build/dsm-foundations-book-manifest.json').read_text())
          assert len(d)>=65, ('Suspiciously short book',len(d))
          assert all(round(p.rect.width)==612 and round(p.rect.height)==792 for p in d)
          assert manifest['font_mode']=='editorial', 'Editorial typeface was not embedded'
          assert manifest['lessons']==11 and manifest['cases']==33 and manifest['concept_maps']==11
          assert manifest['vocabulary']==36 and manifest['questions']==80
          assert manifest['options']==253 and manifest['select_all']==8 and manifest['single']==72
          pages=[p.get_text() for p in d]
          full='\n'.join(pages)
          for i in range(1,12):assert 'CHAPTER %02d'%i in full
          for i in range(1,34):assert re.search(r'CASE\s+'+str(i)+r'\s*/',full),('Missing case',i)
          for i in range(1,81):assert re.search(r'(?m)^%02d\.'%i,full),('missing number',i)
          assert len(d.get_toc())>=15, ('Missing PDF bookmarks',len(d.get_toc()))
          flagged=[]
          sparse=[]
          for idx,p in enumerate(d):
            if len(p.get_text().strip())<100:sparse.append(idx+1)
            for w in p.get_text('words'):
              if w[0]<24 or w[1]<14 or w[2]>p.rect.width-22 or w[3]>p.rect.height-18:
                flagged.append((idx+1,w[:5]))
          assert not flagged[:4],flagged[:4]
          assert len(sparse)<=7,('Many near-empty pages',sparse)
          print(f'PASS: {len(d)} pages; {len(d.get_toc())} outline entries; no out-of-bounds text; sparse pages {sparse}')
          PY
      - name: Verify actual lesson, case, glossary, safety and question text parity
        run: python tests/dsm-print-book-parity.py
      - name: Assemble complete Comparison Atlas as Appendix A before glossary B and worksheet C
        run: python scripts/build-dsm-comparison-appendix.py
      - name: Verify ordered appendices, linked contents and all ten three-part workspaces
        run: |
          python - <<'PY'
          import fitz,json
          from pathlib import Path
          m=json.loads(Path('build/dsm-foundations-with-atlas-manifest.json').read_text())
          original=fitz.open('build/dsm-foundations-complete-review-book.pdf')
          combined=fitz.open('build/dsm-foundations-complete-with-comparison-atlas.pdf')
          assert m['foundations_pages']==len(original)
          assert len(combined)==len(original)+23
          assert m['appendix_label']=='Appendix A'
          assert [p['name'] for p in m['appendix_order']]==['A','B','C']
          pages=[p['page'] for p in m['appendix_order']]
          assert pages==sorted(pages),pages
          index=m['appendix_start']-1
          assert 'APPENDIX A' in combined[index].get_text()
          assert 'Comparison Atlas' in combined[index].get_text()
          assert m['comparisons']==10 and m['three_part_workspaces']==10 and m['venn_diagrams']==10
          assert all('CLINICAL REASONING / WRITING WORKSPACE' in combined[index+2+2*i].get_text() for i in range(10))
          assert sum('Sophia Korb Cohon, PhD' in p.get_text() for p in combined)==1
          assert len(combined[1].get_links())==17, 'Numbered contents links missing'
          for p in m['appendix_order']:
              assert any(x[0]==1 and x[2]==p['page'] and x[1].startswith('Appendix '+p['name']) for x in combined.get_toc())
          for i,p in enumerate(combined):
              visible=[w[4] for w in p.get_text('words') if 750<w[1]<758 and w[0]>530 and w[4].isdigit()]
              assert visible==[str(i+1)], (i+1,visible)
          print(f"PASS: {len(combined)} pages, appendices A/B/C in order, page numbers and 17 links verified")
          PY
      - name: Retain book, manifest and source for QA, without deployment
        uses: actions/upload-artifact@v4
        with:
          name: dsm-foundations-complete-book-review
          if-no-files-found: error
          retention-days: 30
          path: |
            build/dsm-foundations-complete-review-book.pdf
            build/dsm-foundations-book-manifest.json
            build/dsm-foundations-complete-with-comparison-atlas.pdf
            build/dsm-comparison-atlas-standalone-review.pdf
            build/dsm-foundations-with-atlas-manifest.json
            resources/training/dsm-from-zero.html
