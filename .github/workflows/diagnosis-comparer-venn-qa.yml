name: DSM comparer Venn browser QA
on:
  push:
    branches: [feature/dsm-diagnosis-comparer]
    paths:
      - 'resources/training/diagnosis-comparer.html'
      - 'tests/diagnosis-comparer-content-integrity.cjs'
      - 'tests/diagnosis-comparer-venn.cjs'
      - '.github/workflows/diagnosis-comparer-venn-qa.yml'
  pull_request:
    paths:
      - 'resources/training/diagnosis-comparer.html'
      - 'tests/diagnosis-comparer-venn.cjs'
      - 'tests/diagnosis-comparer-content-integrity.cjs'
      - '.github/workflows/diagnosis-comparer-venn-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagram-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Check all authored differential summaries and supported overlaps
        run: node tests/diagnosis-comparer-content-integrity.cjs
      - name: Install Playwright and Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Serve the static site
        run: |
          python -m http.server 8765 --bind 127.0.0.1 >/tmp/cpl-dsm-venn-http.log 2>&1 &
          sleep 2
      - name: Test differential diagram across viewports and print
        run: node tests/diagnosis-comparer-venn.cjs
      - name: Upload Venn screenshots and print PDF
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dsm-venn-visual-evidence
          path: /tmp/cpl-dsm-venn-evidence
          if-no-files-found: ignore
          retention-days: 10
