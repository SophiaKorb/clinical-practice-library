name: CPL comprehensive file-level and PDF QA
on:
  pull_request:
    paths:
      - 'docs/qa/2026-11-12-all-resource-coverage-seed.csv'
      - 'docs/qa/2026-11-12-catalog-evidence-seed.csv'
      - 'docs/qa/2026-11-12-coverage-baseline.json'
      - 'docs/qa/2026-11-12-comprehensive-claim-evidence.json'
      - 'docs/qa/2026-11-12-comprehensive-library-audit.md'
      - 'resources/assessment/trauma-ptsd-dissociation-safety.html'
      - 'resources/assessment/spanish-assessment-forms.html'
      - 'scripts/qa/cpl-pdf-text-audit.py'
      - 'scripts/qa/cpl-complete-resource-matrix.cjs'
      - 'scripts/qa/cpl-coverage-dashboard.cjs'
      - 'scripts/qa/cpl-extra-accessibility.cjs'
      - 'scripts/qa/cpl-dashboard-browser.cjs'
      - 'tests/cpl-complete-coverage.cjs'
      - '.github/workflows/cpl-comprehensive-qa.yml'
jobs:
  resource-coverage:
    if: startsWith(github.head_ref, 'review/cpl-comprehensive-resource-audit-')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated Chromium and PDF reader
        run: |
          python -m pip install --disable-pip-version-check pymupdf
          npm install --no-save --no-audit --no-fund playwright axe-core
          npx playwright install --with-deps chromium
      - name: Audit all 61 source PDF files
        run: python scripts/qa/cpl-pdf-text-audit.py
      - name: Generate and test complete source matrix
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          node scripts/qa/cpl-complete-resource-matrix.cjs
          node tests/cpl-complete-coverage.cjs
          node scripts/qa/cpl-coverage-dashboard.cjs
      - name: Run existing and expanded browser accessibility tests on local source
        run: |
          python -m http.server 8765 --bind 127.0.0.1 > /tmp/cpl-full-audit-http.log 2>&1 &
          for i in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:8765/ >/dev/null; then break; fi
            sleep 1
          done
          node scripts/qa/librarywide-browser.cjs
          node scripts/qa/cpl-source-access-browser.cjs
          node scripts/qa/cpl-extra-accessibility.cjs
          node scripts/qa/cpl-dashboard-browser.cjs
      - name: Upload private reviewer output as Actions artifact, not public site
        uses: actions/upload-artifact@v4
        with:
          name: cpl-all-802-resources-qa-${{ github.run_id }}
          path: |
            review-artifacts/cpl-pdf-text-audit.json
            review-artifacts/cpl-complete-resource-matrix.json
            review-artifacts/cpl-complete-resource-matrix.csv
            review-artifacts/cpl-complete-resource-summary.json
            review-artifacts/cpl-resource-coverage-dashboard.html
            review-artifacts/cpl-extra-accessibility.json
          if-no-files-found: error
          retention-days: 30
