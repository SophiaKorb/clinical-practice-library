name: Library links and navigation
on:
  pull_request:
    paths:
      - '**.html'
      - '**.css'
      - 'navigation.js'
      - 'vercel.json'
      - 'resources/downloads/**'
      - 'scripts/check-library-links.py'
      - '.github/workflows/library-links.yml'
jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: python scripts/check-library-links.py
      - run: node --check navigation.js
      - run: node --check resources/visual-tools.js
      - run: node scripts/check-school-guide-parity.js --self-test
