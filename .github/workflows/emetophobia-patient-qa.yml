name: Patient ERP browser QA
on:
  pull_request:
    paths:
      - 'resources/therapy/emetophobia-medical-anxiety-erp.html'
      - 'tests/emetophobia-patient.cjs'
      - '.github/workflows/emetophobia-patient-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  patient-erp-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install browser
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Serve static files
        run: |
          python -m http.server 8765 --bind 127.0.0.1 >/tmp/emetophobia-http.log 2>&1 &
          sleep 2
      - name: Exercise patient tool at four viewport widths
        run: node tests/emetophobia-patient.cjs
      - name: Attach screenshots and print PDF
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: patient-erp-qa-evidence
          path: /tmp/cpl-emetophobia-evidence
          if-no-files-found: ignore
          retention-days: 10
