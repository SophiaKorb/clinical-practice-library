name: CPL visual reference rendered review QA
on:
  pull_request:
    paths:
      - 'resources/therapy/visual-access-12-tool-reference-review-2026-10-25.html'
      - 'scripts/qa/visual-reference-rendered.cjs'
      - 'scripts/qa/visual-reference-deep-audit.cjs'
      - 'scripts/qa/visual-reference-pdf-audit.py'
      - 'tests/visual-reference-structure.cjs'
      - 'docs/qa/2026-11-11-visual-accessibility-qa.md'
      - 'docs/qa/CPL_Complete_12_Tool_Visual_Review_QA_2026-10-25.md'
      - '.github/workflows/visual-reference-rendered.yml'
jobs:
  chromium-review:
    if: startsWith(github.head_ref, 'review/cpl-visual-accessibility-')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated Chromium runner
        run: |
          npm install --no-save --no-audit --no-fund playwright axe-core
          npx playwright install --with-deps chromium
      - name: Install PDF text and bounding-box analyzer
        run: python3 -m pip install pymupdf
      - name: Test source invariants
        run: node tests/visual-reference-structure.cjs
      - name: Serve local branch and test rendered keyboard and print behaviors
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/cpl-visual-review-http.log 2>&1 &
          for i in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:8765/ > /dev/null; then break; fi
            sleep 1
          done
          node scripts/qa/visual-reference-rendered.cjs
          node scripts/qa/visual-reference-deep-audit.cjs
          python3 scripts/qa/visual-reference-pdf-audit.py /tmp/cpl-visual-deep-qa.pdf
