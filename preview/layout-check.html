<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CPL layout check</title><style>body{margin:0;padding:18px;background:#e8e8e4;font:15px/1.5 system-ui;color:#263a32}header{display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin-bottom:18px}h1{font-size:18px;margin:0}label{display:flex;gap:6px;align-items:center}select{font:inherit;padding:7px}iframe{display:block;height:844px;max-width:none;margin:0 auto;border:1px solid #aaa;background:white}#frame-label{text-align:center;margin:0 0 10px}</style></head><body><header><h1>CPL layout check</h1><label>Page<select id="page"><option value="/">Shelves</option><option value="/preview/">Editorial preview</option><option value="/preview/cpl2.html">Colorful 2.0</option></select></label><label>Width<select id="width"><option value="390">Phone · 390px</option><option value="320">Small phone · 320px</option><option value="768">Tablet · 768px</option><option value="1280">Desktop · 1280px</option></select></label></header><p id="frame-label">390px viewport</p><iframe id="preview" title="CPL page preview" src="/" style="width:390px"></iframe><script>const frame=document.getElementById('preview');const view=document.getElementById('page');const width=document.getElementById('width');view.addEventListener('change',()=>{frame.src=view.value});width.addEventListener('change',()=>{frame.style.width=width.value+'px';document.getElementById('frame-label').textContent=width.value+'px viewport'});</script></body></html>
